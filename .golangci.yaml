version: "2"
run:
  go: "1.24"
  tests: true
  timeout: 5m

linters:
  enable:
    # Default enabled linters only (critical issues)
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  disable:
    # Disable style-heavy linters that cause CI failures
    - wsl
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
      - _test\.go$
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
