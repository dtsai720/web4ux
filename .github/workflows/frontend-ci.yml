name: Frontend CI

on:
  push:
    branches: [ main, setup_ci ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - 'README.md'
      - '.github/workflows/update-readme-coverage.yml'
      - 'scripts/update-coverage-badges.js'
  pull_request:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
      - 'README.md'
      - '.github/workflows/update-readme-coverage.yml'
      - 'scripts/update-coverage-badges.js'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  frontend-quality:
    name: React Frontend - Tests & Linting
    runs-on: ubuntu-latest
    outputs:
      frontend-coverage: ${{ steps.frontend-coverage.outputs.coverage }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install React dependencies
      run: cd frontend && npm ci

    - name: Run ESLint (TypeScript/React)
      run: make lint-frontend

    - name: Run Vitest unit tests with coverage
      run: make test-frontend-coverage

    - name: Generate frontend coverage summary
      id: frontend-coverage
      run: |
        FRONTEND_COVERAGE=$(cd frontend && node -e "
          const fs = require('fs');
          try {
            const coverage = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            const totalPct = coverage.total.lines.pct;
            console.log(totalPct + '%');
          } catch (e) {
            console.log('0%');
          }
        ")
        echo "coverage=$FRONTEND_COVERAGE" >> $GITHUB_OUTPUT
        echo "Frontend Coverage: $FRONTEND_COVERAGE"

    - name: Comment PR with frontend coverage
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const coverage = '${{ steps.frontend-coverage.outputs.coverage }}';
          const comment = `## 🧪 Frontend Coverage Report

          **React/TypeScript Frontend Coverage:** ${coverage}

          > Coverage excludes test files, config files, and node_modules

          _Generated by Frontend CI at ${new Date().toISOString()}_`;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });

    # Skip frontend build in CI - requires Wails runtime generation
    # - name: Build frontend
    #   run: cd frontend && npm run build
