name: Web4UX CI Pipeline

on:
  push:
    branches: [ main, setup_ci ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality:
    name: Go Backend - Tests & Linting
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.coverage }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.1'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install Go dependencies
      run: go mod download

    - name: Install golangci-lint
      run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

    - name: Create fake frontend dist for go:embed
      run: mkdir -p frontend/dist && echo '{}' > frontend/dist/index.html

    - name: Run Go linting
      run: make lint

    - name: Run Go tests with coverage
      run: make test-coverage

    - name: Generate coverage summary
      id: coverage
      run: |
        COVERAGE=$(go tool cover -func=coverage_filtered.out | grep total | awk '{print $3}')
        echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
        echo "Coverage: $COVERAGE"


  frontend-quality:
    name: React Frontend - Tests & Linting
    runs-on: ubuntu-latest
    outputs:
      frontend-coverage: ${{ steps.frontend-coverage.outputs.coverage }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install React dependencies
      run: cd frontend && npm ci

    - name: Run ESLint (TypeScript/React)
      run: make lint-frontend

    - name: Run Vitest unit tests with coverage
      run: make test-frontend-coverage

    - name: Generate frontend coverage summary
      id: frontend-coverage
      run: |
        FRONTEND_COVERAGE=$(cd frontend && node -e "
          const fs = require('fs');
          try {
            const coverage = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            const totalPct = coverage.total.lines.pct;
            console.log(totalPct + '%');
          } catch (e) {
            console.log('0%');
          }
        ")
        echo "coverage=$FRONTEND_COVERAGE" >> $GITHUB_OUTPUT
        echo "Frontend Coverage: $FRONTEND_COVERAGE"

    # Skip frontend build in CI - requires Wails runtime generation
    # - name: Build frontend
    #   run: cd frontend && npm run build

  coverage-report:
    name: Coverage Report
    if: github.event_name == 'pull_request'
    needs: [backend-quality, frontend-quality]
    runs-on: ubuntu-latest

    steps:
    - name: Comment PR with coverage
      uses: actions/github-script@v7
      with:
        script: |
          const backendCoverage = '${{ needs.backend-quality.outputs.coverage }}';
          const frontendCoverage = '${{ needs.frontend-quality.outputs.frontend-coverage }}';
          const comment = `## 🧪 Coverage Report

          | Component | Coverage |
          |-----------|---------|
          | **Backend (Go)** | ${backendCoverage} |
          | **Frontend (React/TS)** | ${frontendCoverage} |

          > Backend coverage excludes auto-generated mocks and sqlc files
          > Frontend coverage excludes test files and config files

          _Generated by CI at ${new Date().toISOString()}_`;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
