name: Web4UX CI Pipeline

on:
  push:
    branches: [ main, setup_ci ]
  pull_request:
    branches: [ main ]

jobs:
  backend-quality:
    name: Go Backend - Tests & Linting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.3'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install Go dependencies
      run: go mod download

    - name: Install golangci-lint
      run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

    - name: Run Go linting
      run: make lint

    - name: Run Go tests with race detection
      run: make test

  frontend-quality:
    name: React Frontend - Tests & Linting
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install React dependencies
      run: cd frontend && npm ci

    - name: Run ESLint (TypeScript/React)
      run: make lint-frontend

    - name: Run Vitest unit tests
      run: make test-frontend

    # Skip frontend build in CI - requires Wails runtime generation
    # - name: Build frontend
    #   run: cd frontend && npm run build
