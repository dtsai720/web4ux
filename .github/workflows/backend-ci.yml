name: Backend CI

on:
  push:
    branches: [ main, setup_ci ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      - '.github/workflows/backend-ci.yml'
      - 'README.md'
      - '.github/workflows/update-readme-coverage.yml'
      - 'scripts/update-coverage-badges.js'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  backend-quality:
    name: Go Backend - Tests & Linting
    runs-on: ubuntu-latest
    outputs:
      coverage: ${{ steps.coverage.outputs.coverage }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.1'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}-
          ${{ runner.os }}-go-

    - name: Install Go dependencies
      run: go mod download

    - name: Install golangci-lint
      run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

    - name: Create fake frontend dist for go:embed
      run: mkdir -p frontend/dist && echo '{}' > frontend/dist/index.html

    - name: Run Go linting
      run: make lint

    - name: Run Go tests with coverage
      run: make test-coverage

    - name: Generate coverage summary
      id: coverage
      run: |
        COVERAGE=$(go tool cover -func=coverage_filtered.out | grep total | awk '{print $3}')
        echo "coverage=$COVERAGE" >> $GITHUB_OUTPUT
        echo "Coverage: $COVERAGE"

    - name: Comment PR with backend coverage
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const coverage = '${{ steps.coverage.outputs.coverage }}';
          const comment = `## 🧪 Backend Coverage Report

          **Go Backend Coverage:** ${coverage}

          > Coverage excludes auto-generated mocks and sqlc files

          _Generated by Backend CI at ${new Date().toISOString()}_`;

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });
